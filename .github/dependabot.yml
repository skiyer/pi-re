version: 2
updates:
  # The agent itself. Dependabot only offers a version that
  # skiyer/pi-docker has already published, so the two images stay in step.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - automerge

  # The MCP server baked into the image.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - automerge
