name: build

# Automatic publication: every run resolves its inputs, derives a CalVer tag,
# publishes the image, and creates a matching git tag + GitHub release whose
# notes record the component versions inside that image.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  schedule:
    - cron: '0 6 * * *'          # daily: pick up new upstream releases
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if no component version changed'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the git tag and release
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: in
        run: |
          set -euo pipefail
          docker pull -q ghcr.io/skiyer/pi-docker:latest
          pi_version=$(docker run --rm ghcr.io/skiyer/pi-docker:latest --version | tr -d '[:space:]')
          mcp_version=$(curl -fsSL https://pypi.org/pypi/ida-mcp/json \
                        | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          echo "pi_version=$pi_version"   >> "$GITHUB_OUTPUT"
          echo "mcp_version=$mcp_version" >> "$GITHUB_OUTPUT"
          echo "pi=$pi_version  server=$mcp_version"

      - name: Detect change
        id: change
        run: |
          set -euo pipefail
          prev_pi=$(python3 -c "import json;print(json.load(open('.github/versions.json'))['pi'])")
          prev_srv=$(python3 -c "import json;print(json.load(open('.github/versions.json'))['server'])")
          pi="${{ steps.in.outputs.pi_version }}"
          srv="${{ steps.in.outputs.mcp_version }}"
          echo "previous: pi=$prev_pi server=$prev_srv"
          echo "resolved: pi=$pi server=$srv"
          if [ "$pi" = "$prev_pi" ] && [ "$srv" = "$prev_srv" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No component changed; nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: pi $prev_pi -> $pi, server $prev_srv -> $srv"
          fi

      - name: Resolve version (CalVer)
        if: steps.change.outputs.changed == 'true'
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base=$(date -u +%Y.%m.%d)
          taken=$(gh api --paginate "/user/packages/container/pi-re/versions" \
                  --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -c "^${base}" || true)
          if [ "$taken" = "0" ]; then version="$base"; else version="${base}.${taken}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      - if: steps.change.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.change.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.change.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.change.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            PI_VERSION=${{ steps.in.outputs.pi_version }}
            MCP_VERSION=${{ steps.in.outputs.mcp_version }}
            BUILD_VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - if: steps.change.outputs.changed == 'true'
        name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PI_VERSION: ${{ steps.in.outputs.pi_version }}
          MCP_VERSION: ${{ steps.in.outputs.mcp_version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Components

          | Component | Version |
          |---|---|
          | pi-re | \`${VERSION}\` |
          | pi | \`${PI_VERSION}\` |
          | re-mcp (MCP server) | \`${MCP_VERSION}\` |
          | platforms | \`linux/amd64\`, \`linux/arm64\` |
          | toolchain | any \`toolchain-vN\` with a matching architecture (>= 9.4) |
          | commit | \`${GITHUB_SHA:0:7}\` |

          ## Use

          \`\`\`bash
          msb run ghcr.io/${GITHUB_REPOSITORY}:${VERSION} --name pi-re -t --mount-disk ~/toolchain-images/toolchain-arm64.erofs:/opt/toolchain:ro,fstype=erofs --mount-dir ~/work:/workspace -- pi
          \`\`\`

          The toolchain is mounted at run time and is versioned independently, so
          the same image works with every \`toolchain-vN\` release.
          EOF
          cat notes.md

      - if: steps.change.outputs.changed == 'true'
        name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; skipping git tag"
          else
            git tag -a "$VERSION" -m "pi-re $VERSION"
            git push origin "$VERSION"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; updating notes"
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
          fi

      - if: steps.change.outputs.changed == 'true'
        name: Summarize
        run: |
          {
            echo "### pi-re ${{ steps.ver.outputs.version }}"
            echo ""
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| pi | ${{ steps.in.outputs.pi_version }} |"
            echo "| re-mcp | ${{ steps.in.outputs.mcp_version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record published versions
        if: steps.change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path(".github/versions.json")
          d = json.loads(p.read_text())
          d["pi"] = "${{ steps.in.outputs.pi_version }}"
          d["server"] = "${{ steps.in.outputs.mcp_version }}"
          d["image"] = "${{ steps.ver.outputs.version }}"
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          git add .github/versions.json
          git diff --cached --quiet || git commit -m "Record published versions ${{ steps.ver.outputs.version }}"
          git push
