name: build

# Every run publishes an image tagged with the build date (CalVer) and creates a
# matching git tag + GitHub release that records the component versions inside.
#
# Upstream upgrades arrive as Dependabot PRs: the pi version is the base image
# tag in the Dockerfile (docker ecosystem), the server version is requirements.txt
# (pip ecosystem). Merging one triggers this workflow.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entry.sh
      - requirements.txt
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if nothing changed'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the git tag and release
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned versions
        id: in
        run: |
          set -euo pipefail
          base_ref=$(grep -m1 '^FROM ghcr.io/skiyer/pi-docker:' Dockerfile | sed 's/^FROM //')
          pi_version=${base_ref##*:}
          mcp_version=$(grep -E '^ida-mcp==' requirements.txt | sed 's/^ida-mcp==//')
          echo "base_ref=$base_ref"       >> "$GITHUB_OUTPUT"
          echo "pi_version=$pi_version"   >> "$GITHUB_OUTPUT"
          echo "mcp_version=$mcp_version" >> "$GITHUB_OUTPUT"
          echo "base=$base_ref  server=$mcp_version"

      - name: Base image must be published
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "${{ steps.in.outputs.base_ref }}" >/dev/null \
            || { echo "::error::${{ steps.in.outputs.base_ref }} is not published yet"; exit 1; }

      - name: Resolve version (CalVer)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base=$(date -u +%Y.%m.%d)
          taken=$(gh api --paginate "/user/packages/container/pi-re/versions" \
                  --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -c "^${base}" || true)
          if [ "$taken" = "0" ]; then version="$base"; else version="${base}.${taken}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            MCP_VERSION=${{ steps.in.outputs.mcp_version }}
            BUILD_VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PI_VERSION: ${{ steps.in.outputs.pi_version }}
          MCP_VERSION: ${{ steps.in.outputs.mcp_version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Components

          | Component | Version |
          |---|---|
          | pi-re | \`${VERSION}\` |
          | pi | \`${PI_VERSION}\` |
          | re-mcp (MCP server) | \`${MCP_VERSION}\` |
          | platforms | \`linux/amd64\`, \`linux/arm64\` |
          | toolchain | any \`toolchain-vN\` with a matching architecture (>= 9.4) |
          | commit | \`${GITHUB_SHA:0:7}\` |

          ## Use

          \`\`\`bash
          msb run ghcr.io/${GITHUB_REPOSITORY}:${VERSION} --name pi-re -t --mount-disk ~/toolchain-images/toolchain-arm64.erofs:/opt/toolchain:ro,fstype=erofs --mount-dir ~/work:/workspace -- pi
          \`\`\`

          The toolchain is mounted at run time and is versioned independently, so
          the same image works with every \`toolchain-vN\` release.
          EOF
          cat notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; skipping git tag"
          else
            git tag -a "$VERSION" -m "pi-re $VERSION"
            git push origin "$VERSION"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
          fi

      - name: Summarize
        run: |
          {
            echo "### pi-re ${{ steps.ver.outputs.version }}"
            echo ""
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| pi | ${{ steps.in.outputs.pi_version }} |"
            echo "| re-mcp | ${{ steps.in.outputs.mcp_version }} |"
          } >> "$GITHUB_STEP_SUMMARY"
